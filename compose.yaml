services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout_local_dev
      POSTGRES_DB: scout
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - scout_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  scout_pgdata:
    name: scout_pgdata
